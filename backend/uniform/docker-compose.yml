services:
  db:
    image: postgres:18-alpine
    container_name: uniform-db
    environment:
      POSTGRES_DB: uniform
      POSTGRES_USER: uniform
      POSTGRES_PASSWORD: postgresUniform
    volumes:
      - uniform_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniform -d uniform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: uniform-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/uniform
      DB_USERNAME: uniform
      DB_PASSWORD: postgresUniform
      JWT_SECRET: segredo-forte
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  uniform_data: